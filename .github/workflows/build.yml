name: Build ss VPN APK

on:
  # Push လုပ်တိုင်း အလိုအလျောက် Build တာကို ပိတ်ထားလိုက်ပါပြီ
  workflow_dispatch: # ဤစာကြောင်းက Actions tab မှနေ၍ ကိုယ်တိုင် Run workflow နှိပ်မှသာ အလုပ်လုပ်စေမည်ဖြစ်သည်

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build VPN Core and Copy
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        
        # ၁။ အရင်က အောင်မြင်ခဲ့သော လမ်းကြောင်းသို့ တိုက်ရိုက်ဝင်မည်
        cd AndroidLibXrayLite
        
        go get github.com/wlynxg/anet@main
        go mod download
        gomobile bind -v -ldflags="-checklinkname=0" -androidapi 21 -target=android -o libv2ray.aar .
        
        # ၂။ Root လမ်းကြောင်းသို့ ပြန်ထွက်မည်
        cd $GITHUB_WORKSPACE
        
        # ၃။ Android App လမ်းကြောင်းကို ရှာပြီး Core ဖိုင်ကို အတိအကျ ကူးထည့်မည်
        GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        mkdir -p $GRADLE_DIR/app/libs
        cp AndroidLibXrayLite/libv2ray.aar $GRADLE_DIR/app/libs/
        echo "Successfully copied libv2ray.aar to $GRADLE_DIR/app/libs/"

    - name: Build Android APK
      run: |
        # ၄။ App လမ်းကြောင်းသို့ဝင်၍ APK တည်ဆောက်မည်
        GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        cd $GRADLE_DIR
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ss-vpn-app
        path: "**/*.apk"
