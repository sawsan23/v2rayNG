# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# Safe limit (4GB) for GitHub Actions Free Runner (which has 7GB total RAM)
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# =======================================================
# Build Performance Optimizations (CI/CD Safe Mode)
# =======================================================
# Run in parallel to fully utilize GitHub Runner's 2 CPU Cores
org.gradle.parallel=true
# Enable build cache to reuse outputs
org.gradle.caching=true
# Configure on demand saves configuration time
org.gradle.configureondemand=true

# [CRITICAL FOR GITHUB ACTIONS]
# Disable Daemon and VFS Watch in CI to prevent Memory Leaks and save limits
org.gradle.daemon=false
org.gradle.vfs.watch=false

# =======================================================
# Android & Kotlin Settings (Preserved from Original)
# =======================================================
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.incremental=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
